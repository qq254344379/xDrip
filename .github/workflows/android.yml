name: Android CI

on:
  push:
    branches: [ "master", "silicon-patch" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode signing keystore
      env:
        KEYSET: ${{ secrets.KEYSET }}
      run: |
        echo "$KEYSET" | python3 -c "import sys,base64; p=sys.stdin.read().strip().split('|'); open('gsdelay-keystore.jks','wb').write(base64.b64decode(p[0]))"
        echo "KEYSTORE_PASSWORD=$(echo "$KEYSET" | cut -d'|' -f2)" >> $GITHUB_ENV
        echo "KEYSTORE_ALIAS=$(echo "$KEYSET" | cut -d'|' -f3)" >> $GITHUB_ENV
        echo "KEYSTORE_KEY_PASSWORD=$(echo "$KEYSET" | cut -d'|' -f4)" >> $GITHUB_ENV
        echo "KEYSTORE_PATH=$(pwd)/gsdelay-keystore.jks" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build signed APK with Gradle
      run: ./gradlew assembleProdRelease

    - name: Upload signed APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xdrip-silicon-signed-apks
        path: app/build/outputs/apk/prod/release/*.apk
